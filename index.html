<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5º COMANDO REGIONAL - Gestão de Efetivo e Prontidão</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b1325;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 35px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .shield-icon {
      font-size: 45px;
      color: #0d6efd;
      margin-bottom: 10px;
    }
    .btn-custom {
      background-color: #0d6efd;
      border: none;
      font-weight: 600;
      padding: 12px;
    }
    #dashboard-view {
      display: none;
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      margin: 20px;
    }
  </style>
</head>
<body>

  <!-- ================= TELA DE LOGIN ================= -->
  <div id="login-view" class="login-card">
    <div class="shield-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h4 class="fw-bold mb-1">5º COMANDO REGIONAL</h4>
    <p class="text-muted small mb-4">Sistema de Gestão de Efetivo e Prontidão</p>

    <!-- Alerta de Erro -->
    <div id="alerta-login" class="alert alert-danger p-2 small d-none" role="alert"></div>

    <form onsubmit="efetuarLogin(event)">
      <div class="mb-3 text-start">
        <label for="login-cpf" class="form-label text-muted small fw-bold">CPF (Apenas Números)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-address-card"></i></span>
          <input type="text" class="form-control" id="login-cpf" placeholder="Digite seu CPF" required maxlength="11">
        </div>
      </div>

      <div class="mb-4 text-start">
        <label for="login-senha" class="form-label text-muted small fw-bold">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="login-senha" placeholder="Digite sua senha" required>
        </div>
      </div>

      <button type="submit" id="btn-entrar" class="btn btn-primary btn-custom w-100">
        <i class="fa-solid fa-right-to-bracket me-2"></i>ACESSAR SISTEMA
      </button>
    </form>
  </div>

  <!-- ================= MODAL PRIMEIRO ACESSO ================= -->
  <div class="modal fade" id="modalTrocaSenha" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-key me-2"></i>Primeiro Acesso - Cadastrar Nova Senha</h5>
        </div>
        <div class="modal-body">
          <p class="small text-muted">Por segurança, altere sua senha padrão antes de continuar.</p>
          <div id="alerta-modal" class="alert alert-danger p-2 small d-none"></div>
          
          <div class="mb-3">
            <label class="form-label small fw-bold">Nova Senha</label>
            <input type="password" id="nova-senha" class="form-control" placeholder="Mínimo de 6 caracteres">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Confirme a Nova Senha</label>
            <input type="password" id="confirma-senha" class="form-control" placeholder="Repita a nova senha">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success w-100" onclick="confirmarTrocaSenha()">Salvar Nova Senha e Entrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= TELA PRINCIPAL (DASHBOARD) ================= -->
  <div id="dashboard-view">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h3 class="fw-bold mb-0">Painel de Gestão e Efetivo</h3>
        <p class="text-muted mb-0">Policial: <span id="user-nome" class="fw-bold text-primary"></span> | Permissão: <span id="user-permissao" class="badge bg-secondary"></span></p>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">
        <i class="fa-solid fa-power-off me-1"></i>Sair do Sistema
      </button>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <div class="card bg-light border-0 p-3 text-center">
          <i class="fa-solid fa-users text-primary fa-2x mb-2"></i>
          <h6 class="fw-bold text-muted mb-1">Efetivo Cadastrado</h6>
          <h3 class="fw-bold mb-0">--</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-light border-0 p-3 text-center">
          <i class="fa-solid fa-shield text-success fa-2x mb-2"></i>
          <h6 class="fw-bold text-muted mb-1">Efetivo em Prontidão</h6>
          <h3 class="fw-bold mb-0">--</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-light border-0 p-3 text-center">
          <i class="fa-solid fa-user-check text-info fa-2x mb-2"></i>
          <h6 class="fw-bold text-muted mb-1">Sessão Ativa</h6>
          <span class="badge bg-success w-50 mx-auto mt-1">Conectado</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL atualizada da implantação do Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycxD7rsaoIl8AJBelE6Wv24qOcxXKCfEgd5vhqraicWyxlofrPmGWFKa8-SE4bpsEI/exec";

    let usuarioLogado = null;

    // Executa ao carregar a página: Mantém a sessão salva no navegador
    window.addEventListener("DOMContentLoaded", () => {
      const sessaoSalva = localStorage.getItem("sgep_usuario");
      if (sessaoSalva) {
        usuarioLogado = JSON.parse(sessaoSalva);
        liberarAcessoDashboard();
      }
    });

    async function efetuarLogin(event) {
      event.preventDefault();

      const cpf = document.getElementById("login-cpf").value.replace(/\D/g, "");
      const senha = document.getElementById("login-senha").value.trim();
      const btn = document.getElementById("btn-entrar");
      const alerta = document.getElementById("alerta-login");

      alerta.classList.add("d-none");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Conectando...`;

      try {
        const url = `${SCRIPT_URL}?acao=login&cpf=${encodeURIComponent(cpf)}&senha=${encodeURIComponent(senha)}`;
        const response = await fetch(url, { redirect: "follow" });
        const res = await response.json();

        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i>ACESSAR SISTEMA`;

        if (res.erro) {
          alerta.innerText = res.mensagem;
          alerta.classList.remove("d-none");
          return;
        }

        usuarioLogado = res;

        if (res.primeiroAcesso) {
          const modalSenha = new bootstrap.Modal(document.getElementById('modalTrocaSenha'));
          modalSenha.show();
        } else {
          localStorage.setItem("sgep_usuario", JSON.stringify(res));
          liberarAcessoDashboard();
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i>ACESSAR SISTEMA`;
        alerta.innerText = "A conexão demorou muito para responder. Tente novamente em alguns instantes.";
        alerta.classList.remove("d-none");
      }
    }

    async function confirmarTrocaSenha() {
      const novaSenha = document.getElementById("nova-senha").value.trim();
      const confirmaSenha = document.getElementById("confirma-senha").value.trim();
      const alertaModal = document.getElementById("alerta-modal");

      alertaModal.classList.add("d-none");

      if (!novaSenha || novaSenha.length < 6) {
        alertaModal.innerText = "A senha deve ter pelo menos 6 caracteres.";
        alertaModal.classList.remove("d-none");
        return;
      }

      if (novaSenha !== confirmaSenha) {
        alertaModal.innerText = "As senhas não coincidem!";
        alertaModal.classList.remove("d-none");
        return;
      }

      try {
        const url = `${SCRIPT_URL}?acao=trocarSenha&cpf=${encodeURIComponent(usuarioLogado.cpf)}&novaSenha=${encodeURIComponent(novaSenha)}`;
        const response = await fetch(url, { redirect: "follow" });
        const res = await response.json();

        if (res.sucesso) {
          const modalEl = document.getElementById('modalTrocaSenha');
          const modalInstance = bootstrap.Modal.getInstance(modalEl);
          modalInstance.hide();
          
          usuarioLogado.primeiroAcesso = false;
          localStorage.setItem("sgep_usuario", JSON.stringify(usuarioLogado));
          liberarAcessoDashboard();
        } else {
          alertaModal.innerText = res.mensagem;
          alertaModal.classList.remove("d-none");
        }
      } catch (err) {
        alertaModal.innerText = "Erro ao atualizar a senha. Tente novamente.";
        alertaModal.classList.remove("d-none");
      }
    }

    function liberarAcessoDashboard() {
      document.getElementById("login-view").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
      document.getElementById("user-nome").innerText = usuarioLogado.nome;
      document.getElementById("user-permissao").innerText = usuarioLogado.permissao || "Usuário";
    }

    function logout() {
      localStorage.removeItem("sgep_usuario");
      usuarioLogado = null;
      document.getElementById("login-cpf").value = "";
      document.getElementById("login-senha").value = "";
      document.getElementById("dashboard-view").style.display = "none";
      document.getElementById("login-view").style.display = "block";
    }
  </script>
</body>
</html>
